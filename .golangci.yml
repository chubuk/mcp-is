version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - gosec
  settings:
    errcheck:
      check-blank: false
    gosec:
      excludes:
        # G104 duplicates errcheck (enabled above) with no extra signal.
        - G104
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
  exclusions:
    rules:
      # Test helpers intentionally ignore Decode/Create/Write errors; gosec
      # flags test fixtures (marshaled "password", md5 in protocol tests).
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # MD5 is mandated by the InSales install protocol (password=MD5(token+key)).
      - path: internal/appinstall/crypto\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
