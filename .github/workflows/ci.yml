name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13+ удалил sre_constants — gixy 0.1.21 на нём не импортируется
          python-version: '3.12'

      - name: Install gixy
        run: pip install gixy==0.1.21

      # compose services declare env_file: .env (gitignored) — runners need dummy
      # values for required vars (DB_PASSWORD has no default since hardening 77c085b)
      - run: echo "DB_PASSWORD=ci-dummy" > .env

      # gixy HIGH fails the gate; hadolint warns only (--no-fail in Makefile)
      - run: make lint-nginx

      - run: make lint-docker

      # eslint/stylelint/html-validate = warn in CI (ratchet: tighten after stabilization)
      - continue-on-error: true
        run: make lint-frontend

  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci --no-fund --no-audit

      # бюджеты в web/lighthouserc.json; вывод = assert-сводка (не raw JSON)
      - run: cd web && npx lhci autorun

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - run: go test ./... -v -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mcp_is
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d mcp_is"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Integration tests
        env:
          TEST_DB_URL: postgres://admin:password@127.0.0.1:5432/mcp_is?sslmode=disable
        run: go test -tags integration ./internal/storage/... ./internal/mcp/... -count=1 -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - run: CGO_ENABLED=0 go build -o mcp-is ./cmd/server

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            image: ghcr.io/${{ github.repository }}
            dockerfile: Dockerfile
          - context: ./web/nginx
            image: ghcr.io/${{ github.repository }}-nginx
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx docker-container driver required for cache-to/from type=gha
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }},${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy is manual (local build → ghcr → VDS) by design — do not add SSH secrets for CI.
  # See .mimocode/skills/mcp-is-deploy/SKILL.md

