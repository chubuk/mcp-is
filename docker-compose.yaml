services:
  db:
    image: postgres:15-alpine
    container_name: mcp_insales_db
    restart: always
    environment:
      POSTGRES_DB: mcp_insales
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./internal/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mcp_insales"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mcp_insales_app
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      DB_URL: postgres://admin:${DB_PASSWORD:-password}@db:5432/mcp_insales?sslmode=disable
      SERVER_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build: ./web/nginx
    container_name: mcp_insales_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./web/static:/usr/share/nginx/html:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  certbot_data:
  certbot_www:
