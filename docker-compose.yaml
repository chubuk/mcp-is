networks:
  internal:
    internal: true
  public:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    container_name: mcp_is_db
    restart: always
    networks:
      - internal
    environment:
      POSTGRES_DB: mcp_is
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./internal/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mcp_is"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: ghcr.io/chubuk/mcp-is:latest
    build: .
    container_name: mcp_is_app
    restart: always
    networks:
      - internal
      - public
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      DB_URL: postgres://admin:${DB_PASSWORD:-password}@db:5432/mcp_is?sslmode=disable
      SERVER_PORT: "8080"
    volumes:
      - ./scripts:/opt/mcp-is/scripts:ro
      - ./backups:/opt/mcp-is/backups
      # docker.sock: certbot/backup вызывают docker exec из app-контейнера
      - /var/run/docker.sock:/var/run/docker.sock
      # /etc/letsencrypt: GetCertInfo читает серт напрямую (статус/планировщик)
      - certbot_data:/etc/letsencrypt:ro
    group_add:
      # GID группы docker на хосте (сокет root:docker)
      - "${DOCKER_GID:-110}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: ghcr.io/chubuk/mcp-is-nginx:latest
    build: ./web/nginx
    container_name: mcp_is_nginx
    restart: always
    networks:
      - public
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./web/static:/usr/share/nginx/html:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      BLOCK_AI_BOTS: ${BLOCK_AI_BOTS:-true}
      BLOCK_SEARCH_BOTS: ${BLOCK_SEARCH_BOTS:-false}
    depends_on:
      - app
    healthcheck:
      # 127.0.0.1 (not localhost) — wget tries ::1 first and fails; HTTPS — :80 only redirects
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db_data:
  certbot_data:
  certbot_www:
