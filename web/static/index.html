<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP IS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/vendor/quill/quill.snow.css">
</head>
<body>
    <div id="impersonate-banner" style="display:none;background:#f39c12;color:#fff;padding:6px 16px;text-align:center;font-size:13px">
        <span id="impersonate-text"></span>
        <button class="btn btn--sm" style="margin-left:12px;background:#e67e22;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer" onclick="App.stopImpersonate()">Выйти из аккаунта</button>
    </div>
    <header class="header" id="header" style="display:none">
        <div class="header__logo">MCP IS</div>
        <button class="header__toggle" id="nav-toggle" onclick="App.toggleNav()">☰</button>
        <nav class="header__nav" id="nav">
            <a href="/dashboard" class="nav-link" data-page="dashboard">Панель</a>
            <a href="/shops" class="nav-link" data-page="shops">Магазины</a>
            <a href="/ai-keys" class="nav-link" data-page="ai-keys">AI-ключи</a>
            <a href="/settings" class="nav-link" data-page="settings">Настройки</a>
            <a href="/admin/users" class="nav-link admin-link" data-page="admin" style="display:none">Админ</a>
            <a href="/admin/server" class="nav-link admin-link" data-page="server" style="display:none">Сервер</a>
            <a href="/admin/pdn" class="nav-link admin-link" data-page="pdn" style="display:none">ПДн</a>
            <a href="/admin/backup" class="nav-link admin-link" data-page="backup" style="display:none">Бэкапы</a>
            <a href="/admin/email" class="nav-link admin-link" data-page="email" style="display:none">Почта</a>
        </nav>
        <div class="header__user">
            <span id="user-nickname"></span>
            <button class="btn btn--sm" onclick="App.logout()">Выйти</button>
        </div>
    </header>

    <main class="main" id="app">
        <!-- Content rendered by JS -->
    </main>

    <footer class="footer">
        <p>MCP IS v0.7.5</p>
    </footer>

    <script src="/vendor/quill/quill.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pagination.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/shops.js"></script>
    <script src="/js/aikeys.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/emailadmin.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
