worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Hide server version
    server_tokens off;

    # Request size limits
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=reset:10m rate=3r/m;
    # MCP: лимит per API-ключ (каждый клиент/агент получает свой бюджет,
    # общий для всех IP). Пустой ключ (без авторизации) не считается — его держит mcp_ip.
    map $http_authorization $mcp_api_key {
        ""      $http_x_api_key;
        default $http_authorization;
    }
    limit_req_zone $mcp_api_key zone=mcp:10m rate=300r/m;
    # Щит от флуда без ключа / из одного источника (не лимит пользователей)
    limit_req_zone $binary_remote_addr zone=mcp_ip:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    # 429 Too Many Requests вместо дефолтных 503
    limit_req_status 429;

    # AI bots blocking
    map $http_user_agent $block_ai_bots {
        default 0;
        "~*GPTBot" 1;
        "~*CCBot" 1;
        "~*Google-Extended" 1;
        "~*Anthropic-AI" 1;
        "~*Claude-Web" 1;
        "~*Bytespider" 1;
        "~*Amazonbot" 1;
        "~*meta-externalagent" 1;
        "~*FacebookBot" 1;
        "~*YandexAI" 1;
        "~*PerplexityBot" 1;
        "~*YouBot" 1;
    }

    # Search bots blocking
    map $http_user_agent $block_search_bots {
        default 0;
        "~*Googlebot" 1;
        "~*Bingbot" 1;
        "~*YandexBot" 1;
        "~*Baiduspider" 1;
        "~*DuckDuckBot" 1;
        "~*Applebot" 1;
    }

    # JSON access log
    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request":"$request",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_response_time":"$upstream_response_time",'
          '"http_user_agent":"$http_user_agent",'
          '"request_id":"$request_id"'
        '}';

    # Request ID
    map $http_x_request_id $request_id_header {
        default $http_x_request_id;
        ""      $request_id;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name ${DOMAIN} *.${DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name ${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Access log
        access_log /var/log/nginx/access.log json_combined;

        # Security headers (also included in locations that set add_header —
        # nginx: add_header on a level cancels inheritance from parent)
        include /etc/nginx/snippets/security-headers.conf;

        # AI bots blocking
        include /etc/nginx/conf.d/block_ai_bots.conf;

        # Search bots blocking
        include /etc/nginx/conf.d/block_search_bots.conf;

        # Block sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|htaccess|htpasswd|bak|sql|log|ini|conf|yaml|yml)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Block metrics endpoint
        location /metrics {
            deny all;
            access_log off;
        }

        # robots.txt (generated by entrypoint.sh)
        location = /robots.txt {
            alias /etc/nginx/robots.txt;
            access_log off;
        }

        # SPA shell — never cache (sensitive after login)
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Static assets — private cache (same TTL as before)
        location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "private, max-age=3600" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # SPA routes + fallback (internal redirect to /index.html gets no-store)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Login (stricter rate limit)
        location /api/login {
            limit_req zone=login burst=3 nodelay;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_header;
        }

        # Reset password (strict rate limit)
        location /api/reset-password {
            limit_req zone=reset burst=1 nodelay;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_header;
        }

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 50;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_header;
        }

        # InSales app callbacks (exact paths, query strings pass through).
        # burst above /api/: InSales egresses from a few IPs and can retry in bursts.
        location ~ ^/(install|uninstall|app|autologin)$ {
            limit_req zone=api burst=50 nodelay;
            limit_conn conn 50;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_header;
        }

        # MCP proxy (rate limited per API key + flood shield)
        location /mcp {
            # delay=60: первые 60 сверх нормы мгновенно, дальше — плавное замедление
            # до burst=200 (очередь), и только сверх 200 — 429.
            limit_req zone=mcp burst=200 delay=60;
            limit_req zone=mcp_ip burst=200 nodelay;
            # 429 → JSON-RPC error вместо HTML: LLM-агенты видят actionable-текст
            # (спека MCP: HTTP error body MAY comprise a JSON-RPC error response)
            error_page 429 = @mcp_rate_limited;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_header;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # 429 от limit_req: JSON-RPC error + Retry-After (для агентов и HTTP-обёрток)
        location @mcp_rate_limited {
            add_header Retry-After 30 always;
            add_header Cache-Control "no-store" always;
            default_type application/json;
            return 429 '{"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Rate limit exceeded: 300 req/min per API key. Wait and retry after 30 seconds; slow down if this repeats.","data":{"retry_after":30}}}\n';
        }

        # Health check
        location /health {
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://app:8080;
        }
    }
}
